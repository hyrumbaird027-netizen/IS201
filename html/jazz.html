<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interval Game</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/layoutstyles.css">
    <style>
        .note-btn {
            padding: 10px 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            min-width: 52px;
            border: 1px solid black;
            background: white;
        }
        .note-btn:hover { background: #f0f0f0; }
        .note-btn.correct { background: #EAF3DE; border-color: #639922; color: #3B6D11; }
        .note-btn.wrong { background: #FCEBEB; border-color: #A32D2D; color: #A32D2D; }
        .note-btn:disabled { cursor: default; }
        #feedback { min-height: 28px; font-size: 15px; font-weight: bold; margin: 12px 0 4px; }
        .game-wrapper { padding: 20px; max-width: 500px; margin: 0 auto; }
        .score-row { display: flex; gap: 20px; margin-bottom: 16px; font-size: 14px; color: gray; }
        .question-box { background: antiquewhite; border: 1px solid black; padding: 16px; margin-bottom: 16px; }
        .question-box .interval-label { font-size: 13px; color: gray; margin-bottom: 4px; }
        .question-box .question-text { font-size: 20px; font-weight: 500; }
        .note-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 8px; }
        #next-btn { margin-top: 16px; padding: 8px 24px; display: none; cursor: pointer; }
    </style>
</head>
<body id="game">
    <div class="common header">
        <img src="../images/sax.jpg" height="100" alt="picture of sax">
        <h1 style="display:inline; margin-left:20px;">Jazz!</h1>
        <span class="subheader">
            <a href="../index.html">home</a> |
            <a href="resume.html">resume</a> |
            <a href="mets.html">jazz</a> |
            <a href="#">play a game</a>
        </span>
    </div>

    <div class="common mainbody" style="left: 5px; right: 5px;">
        <div class="game-wrapper">
            <h2>Interval Trainer</h2>
            <p>Given a starting note and an interval, click the correct note above it.</p>

            <div class="score-row">
                <span>Score: <b id="score">0</b></span>
                <span>Streak: <b id="streak">0</b></span>
                <span>Total: <b id="total">0</b></span>
            </div>

            <div class="question-box">
                <div class="interval-label" id="interval-label">Interval</div>
                <div class="question-text" id="question">Loading...</div>
            </div>

            <div id="feedback"></div>

            <div class="note-grid" id="note-grid"></div>

            <button id="next-btn">Next question →</button>
        </div>
    </div>

    <div class="common footer">
        "Ya like jazz?" - Barry B. Benson
    </div>

    <script>
        const notes = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
        const intervals = [
            { name: 'minor 2nd', semitones: 1 },
            { name: 'major 2nd', semitones: 2 },
            { name: 'minor 3rd', semitones: 3 },
            { name: 'major 3rd', semitones: 4 },
            { name: 'perfect 4th', semitones: 5 },
            { name: 'tritone', semitones: 6 },
            { name: 'perfect 5th', semitones: 7 },
            { name: 'minor 6th', semitones: 8 },
            { name: 'major 6th', semitones: 9 },
            { name: 'minor 7th', semitones: 10 },
            { name: 'major 7th', semitones: 11 },
        ];

        let score = 0, streak = 0, total = 0, answer = '', answered = false;

        const grid = document.getElementById('note-grid');
        notes.forEach(n => {
            const btn = document.createElement('button');
            btn.className = 'note-btn';
            btn.textContent = n;
            btn.dataset.note = n;
            btn.onclick = () => checkAnswer(n, btn);
            grid.appendChild(btn);
        });

        function newQuestion() {
            answered = false;
            document.getElementById('feedback').textContent = '';
            document.getElementById('next-btn').style.display = 'none';
            grid.querySelectorAll('.note-btn').forEach(b => {
                b.classList.remove('correct', 'wrong');
                b.disabled = false;
            });

            const root = notes[Math.floor(Math.random() * 12)];
            const interval = intervals[Math.floor(Math.random() * intervals.length)];
            const rootIdx = notes.indexOf(root);
            answer = notes[(rootIdx + interval.semitones) % 12];

            document.getElementById('interval-label').textContent =
                interval.name.charAt(0).toUpperCase() + interval.name.slice(1);
            document.getElementById('question').textContent =
                `Starting on ${root} — what note is a ${interval.name} above?`;
        }

        function checkAnswer(note, btn) {
            if (answered) return;
            answered = true;
            total++;
            document.getElementById('total').textContent = total;
            grid.querySelectorAll('.note-btn').forEach(b => b.disabled = true);

            if (note === answer) {
                btn.classList.add('correct');
                score++;
                streak++;
                document.getElementById('feedback').style.color = 'green';
                document.getElementById('feedback').textContent = 'Correct!';
            } else {
                btn.classList.add('wrong');
                streak = 0;
                document.getElementById('feedback').style.color = 'red';
                document.getElementById('feedback').textContent = `Not quite — the answer was ${answer}`;
                grid.querySelectorAll('.note-btn').forEach(b => {
                    if (b.dataset.note === answer) b.classList.add('correct');
                });
            }

            document.getElementById('score').textContent = score;
            document.getElementById('streak').textContent = streak;
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        document.getElementById('next-btn').onclick = newQuestion;
        newQuestion();
    </script>
</body>
</html>
